# Tooling only — not a deployment. Production runs on Windows next to the MT5 terminal.
# docker compose run --rm test pytest
# docker compose run --rm test ruff check .
# docker compose run --rm test mypy
services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app:ro  # read-only: the container never writes into the repo
    environment:
      PYTHONPATH: /app/src:/app
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      MYPY_CACHE_DIR: /tmp/mypy_cache
      RUFF_CACHE_DIR: /tmp/ruff_cache
      DATABASE_URL: sqlite:////tmp/plough_backer.db
